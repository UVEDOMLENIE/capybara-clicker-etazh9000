<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>СКОРО</title>
<meta name="description" content="скоро здесь будет игра">
<!-- трекинг НЕ встроен: решение NERV. Ни устройства, ни IP, ни личности. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#05010f;--fg:#fff;--y:#ffde00;--o:#ff8a1f;--r:#ff3b3b;--c:#3bd6ff;--dim:#8a8a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:"PT Mono",ui-monospace,monospace;display:flex;align-items:center;justify-content:center}
.px{font-family:"Press Start 2P",monospace;letter-spacing:.5px}
.sky{position:fixed;inset:0;background:
  radial-gradient(1px 1px at 20% 30%,#fff,transparent),
  radial-gradient(1px 1px at 70% 60%,#bcd,transparent),
  radial-gradient(1px 1px at 40% 80%,#fff,transparent),
  radial-gradient(2px 2px at 85% 20%,#9cf,transparent),
  radial-gradient(1px 1px at 55% 15%,#fff,transparent),
  radial-gradient(1px 1px at 10% 70%,#fff,transparent);
  background-repeat:repeat;background-size:320px 320px;animation:drift 14s linear infinite;opacity:.8}
@keyframes drift{to{background-position:320px 320px}}
.wrap{position:relative;width:100%;max-width:560px;padding:24px;text-align:center}
.heart{font-size:min(16vw,70px);color:var(--c);filter:drop-shadow(0 0 14px rgba(59,214,255,.6));animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.22)}45%{transform:scale(1.05)}}
.title{font-size:min(7vw,30px);color:var(--c);margin:22px 0 6px;line-height:1.3}
.sub{font-size:min(3.4vw,12px);color:var(--y);line-height:2}
.bar{margin:30px auto 0;width:min(80%,320px);height:14px;border:2px solid #334;background:#0a0820;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 70% 0 0;background:linear-gradient(90deg,var(--o),var(--y));animation:load 2.6s ease-in-out infinite alternate}
@keyframes load{from{right:72%}to{right:34%}}
.pct{font-size:8px;color:var(--dim);margin-top:10px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.3}}
.for{font-size:9px;color:var(--dim);margin-top:34px;letter-spacing:1px}
.for b{color:var(--y)}
</style>
</head>
<body>
<div class="sky"></div>
<div class="wrap">
  <div class="heart">ϟ</div>
  <div class="title px">СКОРО</div>
  <div class="sub px">здесь будет игра</div>
  <div class="bar"><i></i></div>
  <div class="pct px">зайди позже</div>
  <div class="for px">для <b>лисички-сестрички</b></div>
</div>
</body>
</html>
