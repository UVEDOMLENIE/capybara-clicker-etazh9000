<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>СКОРО</title>
<meta name="description" content="скоро здесь будет игра">
<!-- трекинг НЕ встроен: решение NERV. Скрипт только печатает текст, в сеть не ходит. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#02060a;--fg:#7dff6a;--y:#ffde00;--o:#ff8a1f;--r:#ff3b3b;--dim:#2f5a2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:"PT Mono",ui-monospace,monospace;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1.7}
.px{font-family:"Press Start 2P",monospace}
.term{width:100%;max-width:560px;height:100%;max-height:560px;padding:22px 20px;overflow:hidden;position:relative}
.term:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(125,255,106,.05) 0 1px,transparent 1px 3px)}
#log{white-space:pre-wrap;word-break:break-word}
.dim{color:var(--dim)}
.y{color:var(--y)} .o{color:var(--o)} .r{color:var(--r)}
.cur{display:inline-block;width:9px;height:17px;background:var(--fg);vertical-align:-3px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
</style>
</head>
<body>
<div class="term"><div id="log"></div></div>
<script>
const L=[
 ['НЕРВ // boot v0.1','dim'],
 ['> монтирую мир ...... ok','fg'],
 ['> загружаю персонажей .. ok','fg'],
 ['> собираю поздравление .. ','fg'],
 ['  адресат: ЛИСИЧКА-СЕСТРИЧКА','y'],
 ['  трекинг: ОТКЛЮЧЁН','dim'],
 ['> компиляция игры ...... 87%','o'],
 ['',''],
 ['СТАТУС: СКОРО','r'],
 ['здесь будет игра. зайди позже.','y']
];
const box=document.getElementById('log');let li=0,ci=0,cur;
function tick(){
 if(li>=L.length){if(cur)cur.remove();const c=document.createElement('span');c.className='cur';box.appendChild(c);return;}
 const [txt,cls]=L[li];
 if(ci===0){const d=document.createElement('div');d.className=cls;d.dataset.i=li;box.appendChild(d);}
 const d=box.querySelector('div[data-i="'+li+'"]');
 if(ci<txt.length){d.textContent=txt.slice(0,++ci);setTimeout(tick,txt[ci-1]===' '?22:38);}
 else{ci=0;li++;setTimeout(tick,li===8?520:230);}
}
tick();
</script>
</body>
</html>
