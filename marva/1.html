<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>СКОРО</title>
<meta name="description" content="скоро здесь будет игра">
<!-- трекинг НЕ встроен: решение NERV. Ни устройства, ни IP, ни личности. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--y:#ffde00;--o:#ff8a1f;--r:#ff3b3b;--dim:#8a8a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:"PT Mono",ui-monospace,monospace;display:flex;align-items:center;justify-content:center}
.px{font-family:"Press Start 2P",monospace;letter-spacing:.5px}
.wrap{width:100%;max-width:560px;padding:24px;text-align:center;position:relative}
.coin{font-size:9px;color:var(--dim);margin-bottom:28px}
.title{font-size:min(13vw,52px);color:var(--o);line-height:1.1;text-shadow:4px 4px 0 #3a1500}
.sub{font-size:min(3.6vw,13px);color:var(--y);margin-top:18px;line-height:2}
.heart{font-size:min(10vw,46px);color:var(--c);margin:30px 0 8px;animation:beat 1.1s steps(2) infinite}
.press{font-size:min(3vw,11px);color:#bbb;margin-top:26px;animation:blink 1.1s steps(1) infinite}
.for{font-size:9px;color:var(--dim);margin-top:40px;letter-spacing:1px}
.for b{color:var(--y)}
@keyframes beat{50%{transform:scale(1.18)}}
@keyframes blink{50%{opacity:0}}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
</style>
</head>
<body>
<div class="wrap">
  <div class="coin px">INSERT COIN</div>
  <div class="title px">СКОРО</div>
  <div class="sub px">здесь будет игра</div>
  <div class="heart">ϟ</div>
  <div class="press px">▸ зайди позже</div>
  <div class="for px">поздравление для <b>лисички-сестрички</b></div>
</div>
<div class="scan"></div>
</body>
</html>
