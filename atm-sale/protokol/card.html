<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПРОТОКОЛ — визитка 90×50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:wght@300;400&display=swap" rel="stylesheet">
<style>
  @page{size:90mm 50mm;margin:0}
  :root{
    --ink:#111214;--muted:#6a6d73;--line:#c9cacc;--dark:#15161a;
    --sans:"IBM Plex Sans",Arial,sans-serif;--serif:"IBM Plex Serif",Georgia,serif;--mono:"IBM Plex Mono",Consolas,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{background:#e9e9e7;font-family:var(--sans);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact;overflow-x:hidden}

  .sheet{display:flex;flex-direction:column;align-items:center;gap:28px;padding:32px 16px 48px}
  .cap{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 -18px;width:90mm;max-width:100%}
  .scaler{width:90mm;max-width:100%}

  .card{position:relative;width:90mm;height:50mm;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08)}

  /* ---------- лицо ---------- */
  .front{background:var(--dark);color:#fff}
  .front .frame{position:absolute;inset:4mm;border:.2mm solid rgba(255,255,255,.28)}
  .front .num{position:absolute;top:6.5mm;left:7mm;font-family:var(--mono);font-size:5.6pt;letter-spacing:.12em;color:rgba(255,255,255,.55)}
  .front .num-r{left:auto;right:7mm}
  .front .name{position:absolute;left:7mm;right:7mm;top:19.5mm;text-align:center;font-weight:500;font-size:15pt;letter-spacing:.42em;padding-left:.42em;line-height:1}
  .front .bar{position:absolute;left:50%;top:27.2mm;width:10mm;height:.25mm;background:#fff;transform:translateX(-50%)}
  .front .sub{position:absolute;left:7mm;right:7mm;top:30mm;text-align:center;font-family:var(--serif);font-weight:300;font-size:7pt;letter-spacing:.06em;color:rgba(255,255,255,.82)}
  .front .foot{position:absolute;left:7mm;right:7mm;bottom:6.5mm;text-align:center;font-family:var(--mono);font-size:5pt;letter-spacing:.14em;color:rgba(255,255,255,.45);text-transform:uppercase}

  /* ---------- оборот ---------- */
  .back .brand{position:absolute;top:6mm;left:7mm;font-weight:600;font-size:6.6pt;letter-spacing:.32em}
  .back .doc{position:absolute;top:6mm;right:7mm;font-family:var(--mono);font-size:5.4pt;letter-spacing:.1em;color:var(--muted)}
  .back .hr{position:absolute;left:7mm;right:7mm;top:10.6mm;height:.2mm;background:var(--ink)}
  .back .who{position:absolute;left:7mm;top:16mm}
  .back .who b{display:block;font-family:var(--serif);font-weight:400;font-size:15pt;line-height:1}
  .back .who span{display:block;margin-top:1.8mm;font-size:6.8pt;letter-spacing:.03em;color:var(--muted)}
  .back .rows{position:absolute;left:7mm;right:7mm;bottom:6mm;border-top:.2mm solid var(--line)}
  .back .row{display:flex;justify-content:space-between;align-items:baseline;padding:1.3mm 0;border-bottom:.2mm solid var(--line);font-size:7pt}
  .back .row .k{font-family:var(--mono);font-size:5.2pt;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .back .row .v{font-family:var(--mono);font-size:7pt;letter-spacing:.01em}

  /* Узкий экран: визитка масштабируется, чтобы не было горизонтального скролла */
  @media screen and (max-width:372px){ .sheet{zoom:.9} }
  @media screen and (max-width:340px){ .sheet{zoom:.8} }

  @media print{
    body{background:none}
    .sheet{display:block;padding:0}
    .cap{display:none}
    .scaler{width:auto;height:auto}
    .card{box-shadow:none;transform:none!important;page-break-after:always;break-after:page}
    .card:last-of-type{page-break-after:auto;break-after:auto}
  }
</style>
</head>
<body>
<div class="sheet">
  <p class="cap">Лицо · 90 × 50 мм</p>
  <div class="scaler">
    <div class="card front">
      <div class="frame"></div>
      <div class="num">РЕД. 1.0</div>
      <div class="num num-r">2026</div>
      <div class="name">ПРОТОКОЛ</div>
      <div class="bar"></div>
      <div class="sub">Аудит коммерческих коммуникаций</div>
      <div class="foot">Сайт · Заявка · Звонок · Мессенджеры · Почта</div>
    </div>
  </div>

  <p class="cap">Оборот · 90 × 50 мм</p>
  <div class="scaler">
    <div class="card back">
      <div class="brand">ПРОТОКОЛ</div>
      <div class="doc">РАЗДЕЛ 5.1</div>
      <div class="hr"></div>
      <div class="who"><b>Таур</b><span>Ведущий аудитор</span></div>
      <div class="rows">
        <div class="row"><span class="k">Телефон</span><span class="v">+7 (000) 000-00-00</span></div>
        <div class="row"><span class="k">Почта</span><span class="v">mail@example.com</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
